<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lisa • Store management</title><link rel="stylesheet" href="/assets/backend.css"><main><header><a href="/">LISA <small>ELECTRONICS</small></a><span>Store management</span><button id="logout" hidden>Sign out</button></header><h1>Your shop, at a glance.</h1><p class="muted">Manage your catalogue and keep every order in view.</p><p id="message" role="status"></p><form id="login"><h2>Welcome back</h2><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in securely</button></form><section id="dashboard" hidden><nav><button id="productsTab">Products</button><button id="ordersTab">Orders</button><button id="add">+ Add product</button></nav><label>Search<input id="search" placeholder="Search name, SKU or customer email"></label><p id="count"></p><div id="list"></div></section><dialog id="editor"><form id="productForm"><h2>Edit product</h2><input name="id" type="hidden"><label>Name<input name="name" required maxlength="250"></label><label>SKU<input name="sku" required></label><label>Slug<input name="slug" required pattern="[a-z0-9-]+"></label><label>Category<select name="category_id"></select></label><label>Description<textarea name="description"></textarea></label><div class="columns"><label>Price (₦)<input name="price" type="number" min="0" step="0.01" required></label><label>Physical stock quantity<input name="stock_quantity" type="number" min="0" step="1" required></label></div><label><input name="track_stock" type="checkbox"> Track physical stock</label><p class="muted">Enable this when you have counted stock. Quantities reduce when reserved for checkout.</p><label><input name="allow_backorder" type="checkbox" checked> Allow orders when physical stock runs out (source afterwards)</label><label>Image URLs (one HTTPS link per line)<textarea name="images"></textarea></label><label><input name="published" type="checkbox"> Publish product</label><p id="editorMessage" role="status"></p><button>Save changes</button><button type="button" id="cancel">Cancel</button></form></dialog></main><script type="module" src="/assets/admin.js"></script></html>
